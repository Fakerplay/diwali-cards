  <main class="stage" id="stage" aria-roledescription="carousel" aria-label="Diwali Festive Cards">
    <!-- Festive depth layer: 30-40 out-of-focus warm bokeh dots -->
    <div class="bokeh-layer" id="bokeh-layer" aria-hidden="true"></div>

    <!-- Active card radial/conic vignette glows -->

      <div class="vignette-glow is-active" data-card="diya"></div>
      <div class="vignette-glow" data-card="rangoli"></div>
      <div class="vignette-glow" data-card="phuljhadi"></div>
      <div class="vignette-glow" data-card="genda"></div>
    </div>

    <!-- Subtle floor horizon sheen -->
    <div class="floor-horizon" id="floor-horizon" aria-hidden="true"></div>

    <!-- Static illustrated effects for prefers-reduced-motion & WebGL fallback -->
    <div class="static-effect-layer" id="static-effect-layer" aria-hidden="true">
